services:
  arbitrum:
    # v3.9.4 -> v3.11.3 (2026-08-20): Arbitrum One activated ArbOS 52 and v3.9.4's upgrade
    # switch stops at ArbOS 51, so it hard-failed every block with "the chain is upgrading
    # to unsupported ArbOS version 52" and stopped advancing. v3.11.3 handles 52-61.
    image: offchainlabs/nitro-node:v3.11.3-beb2108
    container_name: arbitrum-one
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/rpc_nodes/arbitrum:/home/user/.arbitrum
    command:
      - --chain.id=42161
      - --parent-chain.connection.url=${L1_RPC_URL}
      - --parent-chain.blob-client.beacon-url=${L1_BEACON_URL:-https://ethereum-beacon-api.publicnode.com}
      - --node.staker.enable=false
      - --http.api=net,web3,eth,debug
      - --http.addr=0.0.0.0
      - --http.port=8547
      - --http.corsdomain=*
      - --http.vhosts=*
      - --execution.rpc.filter-timeout=30m
      - --execution.rpc.filter-log-cache-size=128
      - --execution.rpc.evm-timeout=30s
      - --ws.addr=0.0.0.0
      - --ws.port=8548
      - --ws.api=net,web3,eth
      - --ws.origins=*
      - --execution.rpc.log-history=0
