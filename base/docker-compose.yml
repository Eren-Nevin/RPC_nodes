services:
  execution:
    build:
      context: ./base-node
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    command: ["bash", "./execution-entrypoint"]
    volumes:
      - /data/rpc_nodes/base-data/reth/snapshots/mainnet/download:/data
    environment:
      RETH_CHAIN: base
      RETH_SEQUENCER_HTTP: https://mainnet-sequencer.base.org
      BASE_NODE_L2_ENGINE_AUTH: /tmp/engine-auth-jwt
      BASE_NODE_L2_ENGINE_AUTH_RAW: 688f5d737bad920bdfb2fc2f488d6b6209eebda1dae949a8de91398d932c517a
      RPC_PORT: "8645"
      WS_PORT: "8646"
      AUTHRPC_PORT: "8551"
      METRICS_PORT: "7301"
      DISCOVERY_PORT: "30403"
      P2P_PORT: "30403"

  node:
    build:
      context: ./base-node
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      - execution
    command: ["bash", "./consensus-entrypoint"]
    environment:
      # --- L1 endpoint: set BASE_NODE_L1_ETH_RPC in .env ---
      BASE_NODE_L1_ETH_RPC: ${BASE_NODE_L1_ETH_RPC:-${OP_NODE_L1_ETH_RPC}}
      BASE_NODE_L1_BEACON: http://127.0.0.1:5052
      BASE_NODE_L1_BEACON_ARCHIVER: https://ethereum-beacon-api.publicnode.com
      BASE_NODE_L1_BEACON_FETCH_ALL_SIDECARS: "true"
      BASE_NODE_L1_RPC_KIND: basic
      BASE_NODE_L1_TRUST_RPC: "true"
      # --- Network ---
      BASE_NODE_NETWORK: base
      BASE_NODE_SYNCMODE: execution-layer
      BASE_NODE_VERIFIER_L1_CONFS: "4"
      BASE_NODE_ROLLUP_LOAD_PROTOCOL_VERSIONS: "true"
      # --- Engine API (shared JWT with execution) ---
      BASE_NODE_L2_ENGINE_KIND: reth
      BASE_NODE_L2_ENGINE_RPC: ws://127.0.0.1:8551
      BASE_NODE_L2_ENGINE_AUTH: /tmp/engine-auth-jwt
      BASE_NODE_L2_ENGINE_AUTH_RAW: 688f5d737bad920bdfb2fc2f488d6b6209eebda1dae949a8de91398d932c517a
      # --- P2P ---
      BASE_NODE_P2P_DISABLE: "false"
      BASE_NODE_P2P_AGENT: base
      BASE_NODE_P2P_LISTEN_IP: 0.0.0.0
      BASE_NODE_P2P_ADVERTISE_TCP_PORT: "9222"
      BASE_NODE_P2P_ADVERTISE_UDP_PORT: "9222"
      BASE_NODE_P2P_INTERNAL_IP: "true"
