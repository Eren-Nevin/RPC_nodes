# Bitcoin Core configuration for RPC node
# Network
chain=main

# RPC
server=1
rpcbind=0.0.0.0
rpcallowip=127.0.0.1/8
rpcallowip=172.16.0.0/12
rpcallowip=10.0.0.0/8
rpcport=8332

# RPC authentication (user: rpc)
rpcauth=rpc:0e354b6e4ae830bed65bf7c3de584181$8f55ec7f2d6f0692052e6f41e98f8eed9884d894e9c6e12b491611b718b1d63c

# Indexing
txindex=1
coinstatsindex=1

# P2P
listen=1
port=8333
maxconnections=125

# Performance
dbcache=4096
par=0
maxmempool=300

# Bandwidth (limit upload to 1 GB/day)
maxuploadtarget=1440

# ZMQ (for block/tx notifications)
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333
zmqpubhashblock=tcp://0.0.0.0:28332
zmqpubhashtx=tcp://0.0.0.0:28333

# Logging
printtoconsole=1
