services:
  # Execution Layer (Reth)
  reth:
    image: ghcr.io/paradigmxyz/reth:v1.10.0
    container_name: eth-reth
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/rpc_nodes/eth-data/reth:/root/.local/share/reth/mainnet
      - ./jwt.hex:/jwt.hex:ro
    command:
      - node
      - --chain=mainnet
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8555
      - --http.api=eth,net,web3,txpool
      - --http.corsdomain=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8556
      - --ws.api=eth,net,web3
      - --ws.origins=*
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/jwt.hex

  # Consensus Layer (Lighthouse)
  lighthouse:
    image: sigp/lighthouse:v8.0.1
    container_name: eth-lighthouse
    restart: unless-stopped
    network_mode: host
    depends_on:
      - reth
    volumes:
      - /data/rpc_nodes/eth-data/lighthouse:/root/.lighthouse
      - ./jwt.hex:/jwt.hex:ro
    command:
      - lighthouse
      - bn
      - --network=mainnet
      - --execution-endpoint=http://127.0.0.1:8551
      - --execution-jwt=/jwt.hex
      - --checkpoint-sync-url=https://beaconstate.ethstaker.cc
      - --http
      - --http-address=0.0.0.0
      - --http-port=5052
      - --port=9100
      - --discovery-port=9100
