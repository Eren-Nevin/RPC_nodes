services:
  node:
    build: .
    container_name: hyperliquid-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"  # EVM RPC (/evm) + Info API (/info) — loopback only
      - "4001:4001"        # P2P gossip
      - "4002:4002"        # P2P gossip
    volumes:
      - ${DATA_ROOT:-/data/rpc_nodes}/hyperliquid-data:/home/hluser/hl/data
      # Persist hyperliquid_data (visor_abci_state.json + db_hub/evm_db) so a node
      # restart recovers from local state instead of a fragile P2P re-sync that
      # depends on peer availability (added 2026-07-13 after a ~52min re-sync outage).
      - ${DATA_ROOT:-/data/rpc_nodes}/hyperliquid-hlstate:/home/hluser/hl/hyperliquid_data

  event-server:
    build:
      context: .
      dockerfile: Dockerfile.event-server
    container_name: hyperliquid-event-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"  # HTTP + WebSocket event API — loopback only
    volumes:
      - ${DATA_ROOT:-/data/rpc_nodes}/hyperliquid-data:/data/rpc_nodes/hyperliquid-data:ro
    depends_on:
      - node

  pruner:
    build: ./pruner
    container_name: hyperliquid-pruner
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:-/data/rpc_nodes}/hyperliquid-data:/home/hluser/hl/data
