services:
  node:
    build: .
    container_name: hyperliquid-node
    restart: unless-stopped
    ports:
      - "3001:3001"        # EVM RPC (/evm) + Info API (/info)
      - "4001:4001"        # P2P gossip
      - "4002:4002"        # P2P gossip
    volumes:
      - /data/rpc_nodes/hyperliquid-data:/home/hluser/hl/data

  event-server:
    build:
      context: .
      dockerfile: Dockerfile.event-server
    container_name: hyperliquid-event-server
    restart: unless-stopped
    ports:
      - "3002:3002"        # HTTP + WebSocket event API
    volumes:
      - /data/rpc_nodes/hyperliquid-data:/data/rpc_nodes/hyperliquid-data:ro
    depends_on:
      - node

  pruner:
    build: ./pruner
    container_name: hyperliquid-pruner
    restart: unless-stopped
    volumes:
      - /data/rpc_nodes/hyperliquid-data:/home/hluser/hl/data
