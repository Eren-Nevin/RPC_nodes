# ---------------------------------------------------------------------------
# Backend selection: HTTP vs WebSocket per chain
# $http_upgrade is set to "websocket" by clients opening a WS connection;
# empty string for regular HTTP. nginx lowercases header values automatically.
# ---------------------------------------------------------------------------

map $http_upgrade $eth_backend {
    "websocket"  "http://127.0.0.1:8556";
    default      "http://127.0.0.1:8555";
}

map $http_upgrade $arbitrum_backend {
    "websocket"  "http://127.0.0.1:8548";
    default      "http://127.0.0.1:8547";
}

map $http_upgrade $base_backend {
    "websocket"  "http://127.0.0.1:8646";
    default      "http://127.0.0.1:8645";
}

map $http_upgrade $polygon_backend {
    "websocket"  "http://127.0.0.1:8746";
    default      "http://127.0.0.1:8745";
}

map $http_upgrade $bsc_backend {
    "websocket"  "http://127.0.0.1:8846";
    default      "http://127.0.0.1:8845";
}

# Bitcoin Core has no native WebSocket — HTTP-only JSON-RPC
map $http_upgrade $bitcoin_backend {
    default      "http://127.0.0.1:8332";
}

# Hyperliquid node (EVM RPC + Info API) and event-server (HTTP + WS)
map $http_upgrade $hyperliquid_backend {
    default      "http://127.0.0.1:3001";
}

map $http_upgrade $hyperliquid_events_backend {
    "websocket"  "http://127.0.0.1:3002";
    default      "http://127.0.0.1:3002";
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name rpc.defistream.dev;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Main TLS vhost
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    server_name rpc.defistream.dev;

    ssl_certificate     /etc/letsencrypt/live/defistream.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/defistream.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Common proxy settings applied to all locations
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_read_timeout 3600s;  # keep WebSocket connections alive

    # Root: list available endpoints
    location = / {
        add_header Content-Type text/plain;
        return 200 "rpc.defistream.dev\n\nEndpoints:\n  /eth\n  /arbitrum\n  /base\n  /polygon\n  /bsc\n  /bitcoin\n  /hyperliquid/evm\n  /hyperliquid/info\n  /hyperliquid/events\n";
    }

    # Silently drop bot/scanner traffic (no logging)
    location ~ ^/(ws|\.php|wp-) {
        access_log off;
        return 444;
    }

    # ------------------------------------------------------------------
    # Ethereum  (HTTP: 8555, WS: 8556)
    # ------------------------------------------------------------------
    location ~ ^/eth(/.*)?$ {
        rewrite ^/eth/?(.*)$ /$1 break;
        proxy_pass $eth_backend;
    }

    # ------------------------------------------------------------------
    # Arbitrum One  (HTTP: 8547, WS: 8548)
    # ------------------------------------------------------------------
    location ~ ^/arbitrum(/.*)?$ {
        rewrite ^/arbitrum/?(.*)$ /$1 break;
        proxy_pass $arbitrum_backend;
    }

    # ------------------------------------------------------------------
    # Base  (HTTP: 8645, WS: 8646)
    # ------------------------------------------------------------------
    location ~ ^/base(/.*)?$ {
        rewrite ^/base/?(.*)$ /$1 break;
        proxy_pass $base_backend;
    }

    # ------------------------------------------------------------------
    # Polygon PoS  (HTTP: 8745, WS: 8746)
    # ------------------------------------------------------------------
    location ~ ^/polygon(/.*)?$ {
        rewrite ^/polygon/?(.*)$ /$1 break;
        proxy_pass $polygon_backend;
    }

    # ------------------------------------------------------------------
    # BSC  (HTTP: 8845, WS: 8846)
    # ------------------------------------------------------------------
    location ~ ^/bsc(/.*)?$ {
        rewrite ^/bsc/?(.*)$ /$1 break;
        proxy_pass $bsc_backend;
    }

    # ------------------------------------------------------------------
    # Bitcoin  (HTTP: 8332)
    # ------------------------------------------------------------------
    location ~ ^/bitcoin(/.*)?$ {
        rewrite ^/bitcoin/?(.*)$ /$1 break;
        proxy_pass $bitcoin_backend;
    }

    # ------------------------------------------------------------------
    # Hyperliquid  (Node: 3001, Event Server: 3002)
    # /hyperliquid/evm  → EVM JSON-RPC
    # /hyperliquid/info → Info API
    # /hyperliquid/events → Event server (HTTP + WS)
    # ------------------------------------------------------------------
    location ~ ^/hyperliquid/evm(/.*)?$ {
        rewrite ^/hyperliquid/evm/?(.*)$ /evm/$1 break;
        proxy_pass $hyperliquid_backend;
    }

    location ~ ^/hyperliquid/info(/.*)?$ {
        rewrite ^/hyperliquid/info/?(.*)$ /info/$1 break;
        proxy_pass $hyperliquid_backend;
    }

    location ~ ^/hyperliquid/events(/.*)?$ {
        rewrite ^/hyperliquid/events/?(.*)$ /$1 break;
        proxy_pass $hyperliquid_events_backend;
    }
}
