services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rpc-nginx
    restart: unless-stopped
    # Host networking so nginx can reach node ports on 127.0.0.1
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      # Mount the full letsencrypt dir so symlinks in live/ resolve correctly
      - /etc/letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
