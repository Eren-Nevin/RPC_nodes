services:
  heimdall:
    image: 0xpolygon/heimdall-v2:0.9.0
    container_name: polygon-heimdall
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/rpc_nodes/polygon-data/heimdall:/heimdall-home
    command:
      - start
      - --home=/heimdall-home

  bor:
    image: 0xpolygon/bor:2.8.0
    container_name: polygon-bor
    restart: unless-stopped
    network_mode: host
    depends_on:
      - heimdall
    environment:
      # Soft heap cap so bor's Go runtime GCs and returns memory to the OS instead of
      # climbing to ~100 GB over weeks (set 2026-07-04). Soft limit — bor can exceed it
      # transiently to avoid OOM, but GCs aggressively to stay near it.
      - GOMEMLIMIT=50GiB
    volumes:
      - /data/rpc_nodes/polygon-data/bor:/bor-home
    command:
      - server
      - --datadir=/bor-home
      - --chain=mainnet
      - --syncmode=full
      - --db.engine=pebble
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8745
      - --http.api=eth,net,web3,txpool,bor,debug
      - --http.corsdomain=*
      - --http.vhosts=*
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8746
      - --ws.api=eth,net,web3
      - --ws.origins=*
      - --bor.heimdall=http://127.0.0.1:1317
      - --bootnodes=enode://48e6326841ce106f6b4e229a1be7e98a1d12be57e328b08cb461f6744ae4e78f5ec2340996ce9b40928a1a90137aadea13e25ca34774b52a3600d13a52c5c7bb@34.185.209.56:30303,enode://8ab6905fe76aa9001adb77135250e918db888cac216870c0e95cf26650d83d31d8c2c93d54c3333e0a2196517c41651d174b743ec3e11f44e595f62b77fec7ba@34.185.162.14:30303,enode://02e0b33cf60fb1f88f853c7c04830156151f4acd1c36173cd3fe1f375801fb4f5be5b3a89c98527915d37ed217752933c3faf4c820df740c9dd681294caebcf6@34.179.171.228:30303,enode://079c387b65b09674825462ea63c528ca996af7b03d19b1b2ab6557347434838067db6dd7ae5e0c2e08d5ba164117f3d7faffbf3e890cb91cffbdf45a433ddfce@35.246.166.189:30303
      - --port=30503
      - --maxpeers=50
      - --cache=4096
      - --txlookuplimit=0
